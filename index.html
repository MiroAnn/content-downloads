<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Видео для публикации</title>
  <style>
    @font-face {
      font-family: "Onest";
      src: url("assets/fonts/Onest-VariableFont_wght.ttf") format("truetype");
      font-weight: 100 900;
      font-display: swap;
    }
    :root { --paper:#F0EBE2; --ink:#161719; --blue:#4260B8; --green:#BACA7A; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Onest",sans-serif; }
    main { width:min(920px,calc(100% - 32px)); margin:0 auto; padding:48px 0 72px; }
    h1 { margin:0 0 32px; font-size:clamp(34px,7vw,64px); line-height:1; letter-spacing:-.04em; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; }
    article { padding:14px; border:2px solid var(--ink); border-radius:22px; background:var(--paper); }
    video { display:block; width:100%; aspect-ratio:9/16; border-radius:12px; background:var(--ink); }
    h2 { margin:16px 2px 12px; font-size:20px; }
    a { display:block; padding:12px 16px; border-radius:999px; background:var(--blue); color:var(--paper); font-weight:750; text-align:center; text-decoration:none; }
    a:hover { background:var(--ink); }
    @media (max-width:640px) { main{padding-top:28px}.grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <main>
    <h1>Видео для публикации</h1>
    <section class="grid" aria-label="Последние видео">
      <article>
        <video controls playsinline preload="metadata" poster="videos/direct-uploads/2026-09-08/previews/IMG_6924.jpg" src="videos/direct-uploads/2026-09-08/IMG_6924.mp4"></video>
        <h2>IMG_6924</h2>
        <a href="videos/direct-uploads/2026-09-08/IMG_6924.mp4" download>Скачать видео</a>
      </article>
      <article>
        <video controls playsinline preload="metadata" poster="videos/direct-uploads/2026-09-08/previews/IMG_6940.jpg" src="videos/direct-uploads/2026-09-08/IMG_6940.mp4"></video>
        <h2>IMG_6940</h2>
        <a href="videos/direct-uploads/2026-09-08/IMG_6940.mp4" download>Скачать видео</a>
      </article>
    </section>
  </main>
</body>
</html>
